<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="color-scheme" content="light dark">
    <title>SIGNify</title>
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=ADLaM+Display&display=swap" rel="stylesheet">
    <script src="theme.js"></script>
  </head>
  <body>
    <header>
      <div class="header-inner">
      <h1><a href="./index.html">SIGNify</a></h1>
      <nav class="menu" aria-label="Primary">
        <ul>
          <li><a href="./index.html">Sign</a></li>
          <li><a class="active" href="./speech.html">Speech</a></li>
          <li><a href="./settings.html">Settings</a></li>
        </ul>
      </nav>
      </div>
    </header>

    <main>
      <h2>Speech to Text</h2>
      <div class="section-head">
        <h3>Transcribe live</h3>
        <div class="controls">
          <span class="status" id="status" data-state="idle" role="status">Not listening</span>
          <button class="toggle" id="listen" type="button" aria-pressed="false">Listen</button>
        </div>
      </div>
      <p class="note" id="note" role="status" hidden></p>
      <section class="workspace" aria-label="Live transcription workspace">
        <div class="stage">
          <div class="mic-input">
            <div class="audio-viz" id="viz" aria-hidden="true">
              <span></span>
              <span></span>
              <span></span>
              <span></span>
              <span></span>
              <span></span>
              <span></span>
            </div>
            <span>Microphone input</span>
          </div>
        </div>
        <p class="genText">
          <span class="committed" id="committed" aria-live="polite"></span>
          <span class="partial" id="partial" aria-hidden="true"></span>
          <span class="placeholder" id="placeholder">The transcription will appear here...</span>
        </p>
      </section>
    </main>

    <script type="module" src="speech.js"></script>
  </body>
</html>
