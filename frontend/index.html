<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Signagram</title>
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=ADLaM+Display&family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
  </head>
  <body>
    <header>
      <div class="header-inner">
      <h1><a href="./index.html">Signagram</a></h1>
      <nav class="menu" aria-label="Primary">
        <ul>
          <li><a class="active" href="./index.html">Sign</a></li>
          <li><a href="./speech.html">Speech</a></li>
          <li><a href="./settings.html">Settings</a></li>
        </ul>
      </nav>
      </div>
    </header>

    <main>
      <h2>Sign to Text</h2>
      <div class="section-head">
        <h3>Translate live</h3>
        <button class="toggle" type="button" aria-pressed="false">Speak</button>
      </div>
      <section class="workspace" aria-label="Live translation workspace">
        <div class="stage">Camera feed</div>
        <p class="genText">
          <span class="committed" id="committed" aria-live="polite"></span>
          <span class="placeholder" id="placeholder">The translation will appear here...</span>
        </p>
      </section>
    </main>

    <script>
      document.querySelector(".toggle").addEventListener("click", (event) => {
        const button = event.currentTarget;
        button.setAttribute("aria-pressed", button.getAttribute("aria-pressed") === "true" ? "false" : "true");
      });
    </script>
    <script type="module" src="sign.js"></script>
  </body>
</html>
