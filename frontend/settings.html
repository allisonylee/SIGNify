<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Signagram</title>
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=ADLaM+Display&family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
  </head>
  <body>
    <header>
      <div class="header-inner">
      <h1><a href="./index.html">Signagram</a></h1>
      <nav class="menu" aria-label="Primary">
        <ul>
          <li><a href="./index.html">Text</a></li>
          <li><a href="./speech.html">Speech</a></li>
          <li><a class="active" href="./settings.html">Settings</a></li>
        </ul>
      </nav>
      </div>
    </header>

    <main>
      <h2>Settings</h2>
      <h3>Preferences for live translation</h3>
      <section class="settings-grid" aria-label="Settings">
        <article class="settings-card">
          <label class="field">
            <span>Signed Language</span>
            <select>
              <option selected>ASL</option>
            </select>
          </label>
          <label class="field">
            <span>Spoken/Text Language</span>
            <select>
              <option selected>English</option>
              <option>Spanish</option>
            </select>
          </label>
          <label class="field">
            <span>Speech Pitch</span>
            <input type="range" min="0" max="100" value="50">
          </label>
        </article>
      </section>
    </main>
  </body>
</html>
