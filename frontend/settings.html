<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>SIGNify</title>
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=ADLaM+Display&family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
  </head>
  <body>
    <header>
      <div class="header-inner">
      <h1><a href="./index.html">SIGNify</a></h1>
      <nav class="menu" aria-label="Primary">
        <ul>
          <li><a href="./index.html">Sign</a></li>
          <li><a href="./speech.html">Speech</a></li>
          <li><a class="active" href="./settings.html">Settings</a></li>
        </ul>
      </nav>
      </div>
    </header>

    <main>
      <h2>Settings</h2>
      <h3>Preferences for live translation</h3>
      <section class="settings-grid" aria-label="Settings">
        <article class="settings-card">
          <label class="field">
            <span>Signed Language</span>
            <select id="signedLanguage">
              <option>ASL</option>
              <option>ISL</option>
              <option>CSN</option>
            </select>
          </label>
          <label class="field">
            <span>Spoken/Text Language</span>
            <select id="spokenLanguage">
              <option>English</option>
              <option>Hindi</option>
              <option>Spanish</option>
            </select>
          </label>
          <label class="field">
            <span>Speech Pitch</span>
            <div class="slider">
              <input type="range" min="1" max="5" step="1" value="3" id="voicePitch">
              <div class="slider-ticks" aria-hidden="true">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
              </div>
            </div>
          </label>
          <label class="field">
            <span>Voice Age</span>
            <div class="slider">
              <input type="range" min="1" max="5" step="1" value="3" id="voiceAge">
              <div class="slider-ticks" aria-hidden="true">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
              </div>
            </div>
          </label>
          <p class="note" id="voiceNote" role="status"></p>
        </article>
      </section>
    </main>

    <script type="module" src="settings.js"></script>
  </body>
</html>
